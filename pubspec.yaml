name: xora
description: "Xora design system and UI kit for Nexora apps."
version: 0.1.0
homepage: https://github.com/Nexora-Labs-Co/Xora

environment:
  sdk: ^3.13.7
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/fonts/
  fonts:
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/Phosphor.ttf

