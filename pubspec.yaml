name: xora
description: "Xora design system and UI kit for Nexora apps."
version: 26.11.4
homepage: https://github.com/Nexora-Labs-Co/Xora

environment:
  sdk: ^3.13.7
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  font_awesome_flutter: ^11.0.0
  url_launcher: ^6.3.0
  file_picker: ^8.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/fonts/
    - assets/icons/
  fonts:
    - family: Gliker
      fonts:
        - asset: assets/fonts/Gliker-Bold.ttf
          weight: 700

